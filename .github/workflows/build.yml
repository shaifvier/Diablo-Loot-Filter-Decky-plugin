name: Build and test
on:
  push:
    branches: [main, 'feature/build-viewer']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb xclip
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:preview
      - run: pnpm package:preview
      - run: xvfb-run -a python3 tests/check_clipboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: diablo-loot-filters-preview
          path: artifacts/diablo-loot-filters-preview-*
